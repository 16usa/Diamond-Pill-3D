kind = "web"
previewPath = "/"
title = "Diamond Pill 3D"
description = "A full-screen interactive Three.js crystal pill experience with floating motion, iridescent refraction, studio lighting, bloom, and touch-friendly parallax."
version = "1.0.0"
id = "artifacts/diamond-pill-3d"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21198

[services.development]
run = "pnpm --filter @workspace/diamond-pill-3d run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/diamond-pill-3d", "run", "build" ]
serve = "static"
publicDir = "artifacts/diamond-pill-3d/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21198"
BASE_PATH = "/"
